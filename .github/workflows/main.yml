name: Build AVIATOR Sync Mac v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create folders
        run: |
          mkdir -p build
          mkdir -p "AVIATOR Sync.app/Contents/MacOS"
          mkdir -p "AVIATOR Sync.app/Contents/Resources"

      - name: Build Intel binary
        run: |
          xcrun swiftc \
            -target x86_64-apple-macos13.0 \
            -parse-as-library \
            AviatorSyncMacApp.swift \
            ContentView.swift \
            BLEManager.swift \
            -framework SwiftUI \
            -framework CoreBluetooth \
            -framework AppKit \
            -o build/AviatorSyncIntel

      - name: Build Apple Silicon binary
        run: |
          xcrun swiftc \
            -target arm64-apple-macos13.0 \
            -parse-as-library \
            AviatorSyncMacApp.swift \
            ContentView.swift \
            BLEManager.swift \
            -framework SwiftUI \
            -framework CoreBluetooth \
            -framework AppKit \
            -o build/AviatorSyncARM

      - name: Create universal executable
        run: |
          lipo -create \
            build/AviatorSyncIntel \
            build/AviatorSyncARM \
            -output "AVIATOR Sync.app/Contents/MacOS/AviatorSyncMac.bin"

          chmod +x "AVIATOR Sync.app/Contents/MacOS/AviatorSyncMac.bin"

      - name: Create Finder launcher
        run: |
          cat > "AVIATOR Sync.app/Contents/MacOS/AviatorSyncLauncher" <<'EOF'
          #!/bin/bash
          HERE="$(cd "$(dirname "$0")" && pwd)"
          exec "$HERE/AviatorSyncMac.bin"
          EOF

          chmod +x "AVIATOR Sync.app/Contents/MacOS/AviatorSyncLauncher"

      - name: Create Info.plist
        run: |
          cat > "AVIATOR Sync.app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>AVIATOR Sync</string>

              <key>CFBundleDisplayName</key>
              <string>AVIATOR Sync</string>

              <key>CFBundleIdentifier</key>
              <string>com.aviator.syncmac.v2</string>

              <key>CFBundleVersion</key>
              <string>2</string>

              <key>CFBundleShortVersionString</key>
              <string>2.0</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleExecutable</key>
              <string>AviatorSyncLauncher</string>

              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>

              <key>NSBluetoothAlwaysUsageDescription</key>
              <string>Az AVIATOR óra kereséséhez és az idő szinkronizálásához Bluetooth-hozzáférés szükséges.</string>

              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Create PkgInfo
        run: |
          printf "APPL????" > "AVIATOR Sync.app/Contents/PkgInfo"

      - name: Sign app
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            "AVIATOR Sync.app"

          codesign --verify --deep --strict --verbose=2 "AVIATOR Sync.app"

      - name: Test bundle
        run: |
          plutil -lint "AVIATOR Sync.app/Contents/Info.plist"
          file "AVIATOR Sync.app/Contents/MacOS/AviatorSyncMac.bin"
          lipo -archs "AVIATOR Sync.app/Contents/MacOS/AviatorSyncMac.bin"
          ls -la "AVIATOR Sync.app/Contents/MacOS"

      - name: Create ZIP
        run: |
          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "AVIATOR Sync.app" \
            "AVIATOR-Sync-Mac-v2.zip"

      - name: Upload Mac application
        uses: actions/upload-artifact@v4
        with:
          name: AVIATOR-Sync-Mac-v2
          path: AVIATOR-Sync-Mac-v2.zip
          if-no-files-found: error
